name: Verify workspaces

on:
  pull_request:
    branches: [main, dev/native-agent]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workspaces-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run check
