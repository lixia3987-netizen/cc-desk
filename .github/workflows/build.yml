name: Verify and package desktop
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish installers and portable packages to GitHub Releases
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:e2e
      - if: runner.os != 'Linux'
        run: npm run test:e2e
      - if: runner.os == 'Windows'
        run: npm run dist:win
      - if: runner.os == 'macOS'
        run: npm run dist:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - if: runner.os == 'Linux'
        run: npm run dist:linux
      - uses: actions/upload-artifact@v4
        with:
          name: packages-${{ runner.os }}
          if-no-files-found: error
          compression-level: 0
          path: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
            release/*.zip
            release/*.tar.gz
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: claude-workbench-${{ runner.os }}
          path: |
            docs/screenshots/*.png
            test-results/**
  publish:
    needs: build
    if: >-
      github.ref == 'refs/heads/main' &&
      ((github.event_name == 'workflow_dispatch' && inputs.publish_release) ||
       (github.event_name == 'push' && startsWith(github.event.head_commit.message, 'release:')))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          pattern: packages-*
          merge-multiple: true
          path: release-assets
      - name: Publish verified release assets
        run: node scripts/publish-release.mjs
        env:
          GH_TOKEN: ${{ github.token }}
