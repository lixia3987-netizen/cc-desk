name: Verify and package desktop
on:
  pull_request:
    branches: [dev/native-agent]
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish installers and portable packages to GitHub Releases
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            arch: x64
          # Standard macos-15 is Apple Silicon; fail before packaging if that ever changes.
          - os: macos-15
            arch: arm64
          - os: ubuntu-24.04
            arch: x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Verify native runner architecture
        run: node -e "if (process.arch !== '${{ matrix.arch }}') throw new Error('Unexpected runner architecture ' + process.arch)"
      - run: npm ci
      - id: check
        run: npm run check
      - name: Verify real Windows npm Claude launcher
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $claudeNpmPrefix = Join-Path $env:RUNNER_TEMP 'cc-desk npm launcher'
          npm install --global --prefix "$claudeNpmPrefix" @anthropic-ai/claude-code@2.1.278 --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --import tsx apps/desktop/scripts/verify-windows-npm.ts (Join-Path $claudeNpmPrefix 'claude.cmd')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - run: npm run test:e2e
      # Source E2E and packaged smoke are independent gates. A source failure
      # must remain a failed job, but should not hide packaging diagnostics.
      - id: package_windows
        if: ${{ !cancelled() && steps.check.outcome == 'success' && runner.os == 'Windows' }}
        run: npm run dist:win
      - id: package_macos
        if: ${{ !cancelled() && steps.check.outcome == 'success' && runner.os == 'macOS' }}
        run: npm run dist:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - id: package_linux
        if: ${{ !cancelled() && steps.check.outcome == 'success' && runner.os == 'Linux' }}
        run: npm run dist:linux
      - name: Smoke test release payloads on Linux
        if: ${{ !cancelled() && steps.package_linux.outcome == 'success' }}
        run: xvfb-run -a npm run test:packaged
      - name: Smoke test release payloads on Windows and macOS
        if: ${{ !cancelled() && (steps.package_windows.outcome == 'success' || steps.package_macos.outcome == 'success') }}
        run: npm run test:packaged
      - uses: actions/upload-artifact@v4
        with:
          name: packages-${{ runner.os }}-${{ matrix.arch }}
          if-no-files-found: error
          compression-level: 0
          path: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
            release/*.zip
            release/*.tar.gz
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: claude-workbench-${{ runner.os }}-${{ matrix.arch }}
          path: |
            docs/screenshots/*.png
            docs/themes/*.png
            test-results/**
  publish:
    needs: build
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event_name == 'workflow_dispatch' && inputs.publish_release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          pattern: packages-*
          merge-multiple: true
          path: release-assets
      - name: Publish verified release assets
        run: node scripts/publish-release.mjs
        env:
          GH_TOKEN: ${{ github.token }}
