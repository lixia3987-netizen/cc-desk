name: Verify and package desktop
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:e2e
      - if: runner.os != 'Linux'
        run: npm run test:e2e
      - if: runner.os == 'Windows'
        run: npm run dist:win
      - if: runner.os == 'macOS'
        run: npm run dist:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - if: runner.os == 'Linux'
        run: npm run dist:linux
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: claude-workbench-${{ runner.os }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
            docs/screenshots/*.png
            test-results/**
