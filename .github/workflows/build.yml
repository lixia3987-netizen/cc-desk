name: Verify and package desktop
on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Diagnostic branch only; no release is published
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows-process-diagnostic:
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:packages
      - name: Repeat context and core test process exit
        timeout-minutes: 8
        shell: pwsh
        run: |
          for ($iteration = 1; $iteration -le 3; $iteration++) {
            Write-Output "Context/core process attempt $iteration"
            node --import ./scripts/diagnose-test-handles.mjs --import tsx --test --test-concurrency=1 apps/desktop/tests/context-refresh.test.ts apps/desktop/tests/core.test.ts
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Full check with process resource diagnostics
        timeout-minutes: 30
        shell: pwsh
        run: |
          $probePath = Join-Path $PWD 'scripts/diagnose-test-handles.mjs'
          $probeUrl = ([System.Uri]$probePath).AbsoluteUri
          $env:NODE_OPTIONS = '--import=' + $probeUrl
          npm run check
          exit $LASTEXITCODE
